<text x="1355" y="421" fill="#202738" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="650" text-anchor="middle">Quant analyst</text>
<text x="1355" y="461" fill="#687182" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Evidence for the entry</text>
<path d="M1042 306 H1100 V402 H1164" fill="none" stroke="#a9b1bf" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
