<text x="72" y="68" fill="#65d9ed" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">ICAIF 2026  /  AGENTIC PORTFOLIO CONSTRUCTION</text>
<text x="72" y="130" fill="#eef4ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="650" text-anchor="start">A portfolio is decided before it is traded.</text>
<text x="72" y="179" fill="#a9bad1" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Separate evidence. Make a proposal. Measure its risks. Commit only what passes.</text>
