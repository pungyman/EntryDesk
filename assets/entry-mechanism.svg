<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title desc">
<title id="title">EntryDesk: four perspectives, one portfolio</title><desc id="desc">Four specialist analysts provide independent reports to a portfolio manager. The manager drafts a book. Deterministic risk and validation code supplies critique for one revision, then commits initial weights and cash. This overview omits fallback and exposure details, which are documented separately.</desc>
