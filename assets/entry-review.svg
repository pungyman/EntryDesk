<text x="533" y="370" fill="#687182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Proposal</text>
<path d="M998 393 H1121" fill="none" stroke="#a9b1bf" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1067" y="370" fill="#687182" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Report</text>
<path d="M1334 259 V210 H266 V244" fill="none" stroke="#7957bf" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#purple-arrow)" stroke-dasharray="7 7"/>
<text x="800" y="194" fill="#7957bf" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">At most one revision</text>
<path d="M1334 529 V574" fill="none" stroke="#a9b1bf" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1136" y="592" width="396" height="110" rx="22" fill="#edf3ff" stroke="#4d76c8" stroke-opacity=".35" stroke-width="1.8"/>
<g transform="translate(1166,621) scale(0.8)" fill="none" stroke="#4d76c8" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="12" width="40" height="31" rx="5"/><path d="M16 12V6h16v6M4 24h40M20 24v6h8v-6"/></g>
<text x="1221" y="634" fill="#202738" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Validated weights + cash</text>
<text x="1221" y="675" fill="#687182" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Exposure sizing stays in code</text>
<text x="69" y="626" fill="#202738" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="start">If no valid entry survives</text>
<text x="69" y="665" fill="#687182" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Use the inverse-volatility fallback.</text>
<text x="800" y="749" fill="#687182" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">The draft, critique, revision and final weights stay in the decision record.</text>
</svg>
