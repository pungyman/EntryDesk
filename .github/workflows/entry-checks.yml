name: Entry mechanism checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/test.txt
      - run: python -m pip install -r requirements/test.txt
      - run: python -m pytest -q tests/test_v3.py tests/test_vol.py tests/test_daily_features.py tests/test_train.py tests/test_schemas.py
      - run: python examples/entry_demo.py --scenario confirm
      - run: python examples/entry_demo.py --scenario revise
      - run: python examples/entry_demo.py --scenario fallback
